name: Build ChemTrade APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Patch admin SMS flow
        run: python3 .github/scripts/fix-admin-sms.py

      - name: Patch final authentication flow
        run: python3 .github/scripts/finish-auth-flow.py

      - name: Apply SMS and hidden admin fix
        run: python3 scripts/fix-sms-and-admin-access.py

      - name: Apply business features
        run: python3 scripts/fix-business-features.py

      - name: Apply persistent backup
        run: python3 scripts/fix-persistent-backup.py

      - name: Fix PersistentBackup restore ByteArray inference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/dehghanzadeh/chemtrade/PersistentBackup.kt')
          t = p.read_text(encoding='utf-8')
          start = t.index('            val bytes = if (Build.VERSION.SDK_INT >= 29) {', t.index('fun restore('))
          end = t.index('            val root = JSONObject(text)', start)
          replacement = '''            val bytes: ByteArray? = if (Build.VERSION.SDK_INT >= 29) {
                val resolver = context.contentResolver
                val cursor = resolver.query(
                    MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                    arrayOf(MediaStore.Downloads._ID),
                    "${MediaStore.Downloads.DISPLAY_NAME}=? AND ${MediaStore.Downloads.RELATIVE_PATH}=?",
                    arrayOf(FILE_NAME, RELATIVE_PATH),
                    "${MediaStore.Downloads.DATE_MODIFIED} DESC"
                )
                val uri = cursor?.use { c ->
                    if (c.moveToFirst()) {
                        Uri.withAppendedPath(
                            MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                            c.getLong(0).toString()
                        )
                    } else null
                }
                if (uri == null) null else resolver.openInputStream(uri)?.readBytes()
            } else null
            val text = decrypt(bytes ?: return false) ?: return false
'''
          t = t[:start] + replacement + t[end:]
          p.write_text(t, encoding='utf-8')
          print('PERSISTENT BACKUP RESTORE FIX OK')
          PY

      - name: Apply ChemLink visual theme
        run: python3 scripts/apply-brand-theme.py

      - name: Verify JVM target configuration
        run: |
          grep -q 'sourceCompatibility = JavaVersion.VERSION_17' app/build.gradle.kts
          grep -q 'targetCompatibility = JavaVersion.VERSION_17' app/build.gradle.kts
          grep -q 'JVM_17' app/build.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChemTrade-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error