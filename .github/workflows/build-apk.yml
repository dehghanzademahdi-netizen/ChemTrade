name: Build ChemTrade APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Firebase Realtime Database read/write
        env:
          CHEMLINK_FIREBASE_DB_URL: ${{ secrets.CHEMLINK_FIREBASE_DB_URL }}
        run: |
          DB_URL="${CHEMLINK_FIREBASE_DB_URL:-https://chemlink-8909b-default-rtdb.firebaseio.com}"
          DB_URL="${DB_URL%/}"
          TEST_PATH="chemlink/_ci_smoke_test"
          TEST_VALUE="chemtrade-ci-$(date +%s)-$RANDOM"
          echo "Testing Firebase endpoint: $DB_URL"
          HTTP_CODE=$(curl -sS -o /tmp/firebase_put.json -w '%{http_code}' \
            -X PUT "$DB_URL/$TEST_PATH.json" \
            -H 'Content-Type: application/json' \
            --data "\"$TEST_VALUE\"")
          echo "PUT HTTP $HTTP_CODE"
          test "$HTTP_CODE" = "200"
          PUT_BODY=$(cat /tmp/firebase_put.json)
          test "$PUT_BODY" = "\"$TEST_VALUE\""
          HTTP_CODE=$(curl -sS -o /tmp/firebase_get.json -w '%{http_code}' \
            "$DB_URL/$TEST_PATH.json")
          echo "GET HTTP $HTTP_CODE"
          test "$HTTP_CODE" = "200"
          GET_BODY=$(cat /tmp/firebase_get.json)
          test "$GET_BODY" = "\"$TEST_VALUE\""
          HTTP_CODE=$(curl -sS -o /tmp/firebase_delete.json -w '%{http_code}' \
            -X DELETE "$DB_URL/$TEST_PATH.json")
          echo "DELETE HTTP $HTTP_CODE"
          test "$HTTP_CODE" = "200"
          echo "Firebase read/write smoke test PASSED"

      - name: Patch admin SMS flow
        run: python3 .github/scripts/fix-admin-sms.py

      - name: Patch final authentication flow
        run: python3 .github/scripts/finish-auth-flow.py

      - name: Apply SMS and hidden admin fix
        run: python3 scripts/fix-sms-and-admin-access.py

      - name: Apply business features
        run: python3 scripts/fix-business-features.py

      - name: Apply persistent backup
        run: python3 scripts/fix-persistent-backup.py

      - name: Apply cloud persistence and 30-day expiry
        run: python3 scripts/apply-cloud-and-expiry.py

      - name: Apply ChemLink product flow and final UI polish
        run: python3 scripts/apply-final-product-polish.py

      - name: Stabilize final offer form
        run: python3 scripts/fix-final-form.py

      - name: Apply ChemLink visual theme
        run: python3 scripts/apply-brand-theme.py

      - name: Restore phone SMS composer for temporary testing
        run: python3 scripts/restore-phone-sms-for-testing.py

      - name: Restore required document-picker imports and SMS resend reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          e = Path('app/src/main/java/com/dehghanzadeh/chemtrade/EntryActivity.kt')
          s = e.read_text()
          s = s.replace('sendVerificationSms(phone, otp)', 'prepareVerificationSms(phone, otp)')
          e.write_text(s)
          m = Path('app/src/main/java/com/dehghanzadeh/chemtrade/MainActivity.kt')
          s = m.read_text()
          if 'import androidx.activity.compose.rememberLauncherForActivityResult' not in s:
              s = s.replace('import androidx.activity.compose.setContent\n', 'import androidx.activity.compose.rememberLauncherForActivityResult\nimport androidx.activity.compose.setContent\n')
          if 'import androidx.activity.result.contract.ActivityResultContracts' not in s:
              s = s.replace('import androidx.activity.compose.setContent\n', 'import androidx.activity.result.contract.ActivityResultContracts\nimport androidx.activity.compose.setContent\n')
          m.write_text(s)
          PY

      - name: Apply permanent cloud account persistence
        run: python3 scripts/fix-cloud-account-persistence.py

      - name: Apply cloud persistence hooks
        run: python3 scripts/fix-cloud-persistence-hooks.py

      - name: Apply real cloud writes and full offer editing
        run: python3 scripts/fix-real-cloud-and-offer-edit.py

      - name: Verify JVM target configuration
        run: |
          grep -q 'sourceCompatibility = JavaVersion.VERSION_17' app/build.gradle.kts
          grep -q 'targetCompatibility = JavaVersion.VERSION_17' app/build.gradle.kts
          grep -q 'JVM_17' app/build.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        env:
          CHEMLINK_FIREBASE_DB_URL: ${{ secrets.CHEMLINK_FIREBASE_DB_URL }}
        run: |
          DB_URL="${CHEMLINK_FIREBASE_DB_URL:-https://chemlink-8909b-default-rtdb.firebaseio.com}"
          gradle :app:assembleDebug --no-daemon --stacktrace -PchemlinkFirebaseDbUrl="$DB_URL"

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChemTrade-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
