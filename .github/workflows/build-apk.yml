name: Build ChemTrade APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Fix admin OTP to use the same SMS flow as users
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/dehghanzadeh/chemtrade/MainActivity.kt')
          s = p.read_text(encoding='utf-8')

          s = s.replace('import android.Manifest\n', '')
          s = s.replace('import android.content.pm.PackageManager\n', '')
          s = s.replace('import android.telephony.SmsManager\n', '')
          s = s.replace('import androidx.core.content.ContextCompat\n', '')

          old_block = '''    fun sendAdminOtp() {
          val otp = SecureRandom().nextInt(900000).plus(100000).toString()
          try {
              @Suppress("DEPRECATION") val manager = SmsManager.getDefault(); val sms = "ChemLink | کد ورود مدیریت: $otp\\nاین کد را در اختیار دیگران قرار ندهید."; val parts = manager.divideMessage(sms)
              if (parts.size == 1) manager.sendTextMessage(ADMIN_PHONE, null, sms, null, null) else manager.sendMultipartTextMessage(ADMIN_PHONE, null, parts, null, null)
              expected = otp; step = 2; message = "کد ورود به شماره مدیریت ارسال شد."; error = ""
          } catch (_: Exception) { error = "ارسال پیامک ناموفق بود. مجوز SMS و سیم‌کارت را بررسی کنید." }
          sending = false
      }
      val permissionLauncher = rememberLauncherForActivityResult(ActivityResultContracts.RequestPermission()) { granted -> if (granted) sendAdminOtp() else { sending = false; error = "مجوز ارسال پیامک داده نشد." } }
'''

          new_block = '''    fun sendAdminOtp() {
          val otp = SecureRandom().nextInt(900000).plus(100000).toString()
          val sms = "ChemLink\\nکد تأیید ورود به مدیریت: $otp\\nاین کد را در اختیار دیگران قرار ندهید."
          val intent = Intent(Intent.ACTION_SENDTO).apply {
              data = Uri.parse("smsto:$ADMIN_PHONE")
              putExtra("sms_body", sms)
          }
          context.startActivity(intent)
          expected = otp
          step = 2
          message = "پیامک آماده ارسال شد. در برنامه پیامک روی ارسال بزنید، سپس کد را اینجا وارد کنید."
          error = ""
          sending = false
      }
'''

          if old_block not in s:
              raise SystemExit('Expected admin SMS block was not found')
          s = s.replace(old_block, new_block)

          old_click = '''1 -> { sending = true; if (ContextCompat.checkSelfPermission(context, Manifest.permission.SEND_SMS) == PackageManager.PERMISSION_GRANTED) sendAdminOtp() else permissionLauncher.launch(Manifest.permission.SEND_SMS) }'''
          new_click = '''1 -> { sending = true; sendAdminOtp() }'''
          if old_click not in s:
              raise SystemExit('Expected admin SMS click block was not found')
          s = s.replace(old_click, new_click)

          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/dehghanzadeh/chemtrade/MainActivity.kt
          if ! git diff --cached --quiet; then
            git commit -m "Fix admin OTP SMS flow"
            git push
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChemTrade-build-log
          path: build.log
          if-no-files-found: warn

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChemTrade-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
