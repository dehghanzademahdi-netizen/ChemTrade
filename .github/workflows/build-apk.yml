name: Build ChemTrade APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Patch admin SMS flow
        run: python3 .github/scripts/fix-admin-sms.py

      - name: Patch final authentication flow
        run: python3 .github/scripts/finish-auth-flow.py

      - name: Apply SMS and hidden admin fix
        run: python3 scripts/fix-sms-and-admin-access.py

      - name: Apply business features
        run: python3 scripts/fix-business-features.py

      - name: Apply persistent backup
        run: python3 scripts/fix-persistent-backup.py

      - name: Apply cloud persistence and 30-day expiry
        run: python3 scripts/apply-cloud-and-expiry.py

      - name: Apply ChemLink product flow and final UI polish
        run: python3 scripts/apply-final-product-polish.py

      - name: Stabilize final offer form
        run: python3 scripts/fix-final-form.py

      - name: Apply ChemLink visual theme
        run: python3 scripts/apply-brand-theme.py

      - name: Restore phone SMS composer for temporary testing
        run: python3 scripts/restore-phone-sms-for-testing.py

      - name: Repair admin SMS Kotlin source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/dehghanzadeh/chemtrade/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          pattern = r'val sms = "ChemLink \| کد ورود مدیریت: \$otp.*?"; val parts = manager\.divideMessage\(sms\)'
          replacement = r'val sms = "ChemLink | کد ورود مدیریت: $otp\nاین کد را در اختیار دیگران قرار ندهید."; val parts = manager.divideMessage(sms)'
          s2, count = re.subn(pattern, replacement, s, count=1, flags=re.DOTALL)
          if count != 1:
              raise SystemExit(f'Admin SMS source pattern not found (matches={count})')
          p.write_text(s2, encoding='utf-8')
          print('Admin SMS Kotlin source repaired')
          PY

      - name: Verify admin SMS source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('app/src/main/java/com/dehghanzadeh/chemtrade/MainActivity.kt').read_text(encoding='utf-8')
          if 'val sms = "ChemLink | کد ورود مدیریت: $otp\\nاین کد را در اختیار دیگران قرار ندهید."' not in s:
              raise SystemExit('Admin SMS literal verification failed')
          print('Admin SMS source verification passed')
          PY

      - name: Verify JVM target configuration
        run: |
          grep -q 'sourceCompatibility = JavaVersion.VERSION_17' app/build.gradle.kts
          grep -q 'targetCompatibility = JavaVersion.VERSION_17' app/build.gradle.kts
          grep -q 'JVM_17' app/build.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        env:
          CHEMLINK_FIREBASE_DB_URL: ${{ secrets.CHEMLINK_FIREBASE_DB_URL }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace -PchemlinkFirebaseDbUrl="$CHEMLINK_FIREBASE_DB_URL"

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChemTrade-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
