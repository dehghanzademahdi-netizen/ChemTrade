name: Deploy ChemLink Worker

concurrency:
  group: chemlink-worker-deploy
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --no-save wrangler@latest
      - name: Verify configured D1 database
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('wrangler.json', 'utf8'));
          const db = (cfg.d1_databases || []).find(x => x.binding === 'DB' && x.database_name === 'chemlink-otp');
          if (!db || db.database_id !== 'c97a0b11-c7ab-45b8-8b6e-04687398adf6') {
            throw new Error('wrangler.json must bind DB to the production chemlink-otp database');
          }
          console.log('Verified persistent DB binding:', db.binding, '->', db.database_name);
          NODE
      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.json
      - name: Verify production health and OTP route
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://chemlink.shop';
          let last;
          let consecutiveGood = 0;
          for (let attempt = 1; attempt <= 24; attempt++) {
            try {
              const healthResponse = await fetch(base + '/api/health?verify=' + Date.now(), {
                cache: 'no-store',
                headers: { 'cache-control': 'no-cache', 'pragma': 'no-cache' }
              });
              const health = await healthResponse.json();
              console.log('Health check', attempt, JSON.stringify(health));

              const otpResponse = await fetch(base + '/api/auth/send-otp?verify=' + Date.now(), {
                method: 'POST',
                cache: 'no-store',
                headers: { 'content-type': 'application/json', 'cache-control': 'no-cache' },
                body: JSON.stringify({ phone: 'invalid', purpose: 'user' })
              });
              const otp = await otpResponse.json().catch(() => ({}));
              console.log('OTP route diagnostic', otpResponse.status, JSON.stringify(otp));

              const good = healthResponse.ok &&
                health.worker === 'chemlink' &&
                health.build === 'cloud-offers-v1' &&
                health.dbBinding === true &&
                otpResponse.status === 400 &&
                String(otp.error || '').includes('شماره موبایل معتبر نیست');
              if (good) {
                consecutiveGood++;
                if (consecutiveGood >= 3) {
                  console.log('Production health and OTP route both confirm the D1 binding.');
                  process.exit(0);
                }
              } else {
                consecutiveGood = 0;
                last = new Error('Production health or OTP endpoint is still serving an old/misconfigured deployment.');
              }
            } catch (error) {
              consecutiveGood = 0;
              last = error;
              console.log('Production verification attempt failed:', String(error));
            }
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          throw last || new Error('Production Worker verification failed.');
          NODE
